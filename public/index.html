const SERVICES = [

  { k: "diag", href: "diagnostico.html", ic: "check-list", t: "Diagnóstico gratis", d: "Matemática · Física · Química · Lengua",
    p: "En pocos minutos sabes qué temas reforzar, con un desglose por tema y tu informe en PDF.",

  { k: "eng", href: "ingles.html", ic: "globe", t: "Inglés", d: "A1 a C1 · enfoque Cambridge",
    p: "Avanza por niveles con práctica en cada clase. Prueba gratis grammar, writing y reading de tu nivel.",
    li: ["Del primer saludo a la certificación", "Práctica gratis con resultado inmediato", "Informe con cada error explicado"],
    facts: ["5 niveles", "Prueba de nivel"], demo: "en-b1", cta: "Ver niveles", alt: ["ingles.html#practica", "Practicar gratis"] },
  { k: "niv", href: "nivelacion.html", ic: "ruler", t: "Nivelación y tareas dirigidas", d: "Primaria · Bachillerato · Universidad",
    p: "Refuerza Matemáticas, Física e Inglés con atención personalizada y acompañamiento en tus tareas.",

    p: "Te acompañamos desde el tema hasta la defensa, para que el trabajo sea tuyo y puedas defenderlo con seguridad.",
    steps: ["Tema y propuesta", "Marco teórico con APA 7", "Metodología", "Resultados y análisis", "Revisión final y defensa"],
    facts: ["Presencial u online", "Guía gratis en PDF"], cta: "Ver asesoría", alt: ["asesoria.html#guia", "Descargar guía"] },
  { k: "comp", href: "computacion.html", ic: "laptop", t: "Computación e IA", d: "Office · Google · inteligencia artificial",

    steps: ["Word, Excel y PowerPoint para tus tareas", "Google Drive, Docs y Forms", "IA para estudiar: resumir, organizar y verificar", "Ética y uso responsable de la IA"],
    facts: ["Todas las edades", "Práctico"], cta: "Ver módulos" },
];

(function () {
  const menu = document.getElementById("menu"), preview = document.getElementById("preview"), stage = document.getElementById("stage");
  const bgs = [...document.querySelectorAll(".bg")];
  const mobile = matchMedia("(max-width:900px)"), hover = matchMedia("(hover:hover)"), still = matchMedia("(prefers-reduced-motion:reduce)");
  const DUR = 7000;
  let cur = -1, timer = null, paused = false, resume = null;

  // Fotos o videos propios (si existen) sobre la ilustración.
  for (const bg of bgs) {
    const src = MEDIA[bg.dataset.s];
    if (!src) continue;
    if (/\.(mp4|webm|mov)$/i.test(src)) {
      const v = Object.assign(document.createElement("video"), { src, muted: true, loop: true, playsInline: true, autoplay: true, preload: "metadata", className: "media" });
      v.setAttribute("muted", ""); v.setAttribute("playsinline", "");
      v.addEventListener("loadeddata", () => bg.querySelector(".scene")?.remove(), { once: true });
      v.addEventListener("error", () => v.remove(), { once: true });
      bg.prepend(v);
    } else {
      const img = new Image();
      img.onload = () => { const d = document.createElement("div"); d.className = "media"; d.style.backgroundImage = `url("${src}")`; bg.querySelector(".scene")?.remove(); bg.prepend(d); };
      img.src = src;
    }
  }

  menu.innerHTML = SERVICES.map((s, i) => `<li><a href="${s.href}" data-i="${i}"><span class="n">${String(i + 1).padStart(2, "0")}</span><span class="t">${s.t}</span><span class="go" aria-hidden="true"><svg class="i"><use href="img/icons.svg#chev"></use></svg></span><span class="d">${s.d}</span><span class="tm"><i></i></span></a></li>`).join("");
  const links = [...menu.querySelectorAll("a")];

  function panel(s) {
    return `<div class="pv-body"><span class="ic" aria-hidden="true"><svg class="i"><use href="img/icons.svg#${s.ic}"></use></svg></span><h2>${s.t}</h2><p>${s.p}</p>
      ${s.li ? `<ul>${s.li.map(x => `<li>${x}</li>`).join("")}</ul>` : ""}
      ${s.steps ? `<div class="mini">${s.steps.map(x => `<div>${x}</div>`).join("")}</div>` : ""}
      <div class="facts">${s.facts.map(f => `<span>${f}</span>`).join("")}</div>
      ${s.demo ? `<button type="button" class="try"><svg class="i" aria-hidden="true"><use href="img/icons.svg#eye"></use></svg> Vista previa: prueba una pregunta</button><div class="demo-slot"></div>` : ""}
      <div class="row"><a class="btn" href="${s.href}">${s.cta}</a>${s.alt ? `<a class="btn o" href="${s.alt[0]}">${s.alt[1]}</a>` : ""}</div></div>`;
  }

  const inner = stage.querySelector(".stage-in");
  const openUnder = i => mobile.matches && preview.parentElement === links[i].parentElement;

  function show(i, { auto = false, force = false, focusPanel = false } = {}) {
    if (i === cur && !auto && !force) return;
    cur = i;
    const s = SERVICES[i];
    bgs.forEach(b => {
      const on = b.dataset.s === s.k, v = b.querySelector("video");
      b.classList.toggle("on", on);
      if (v) on ? v.play().catch(() => {}) : v.pause();
    });
    links.forEach((a, k) => { a.classList.toggle("on", k === i); a.classList.remove("auto"); a.setAttribute("aria-current", k === i ? "true" : "false"); });
    if (auto) { void links[i].offsetWidth; links[i].classList.add("auto"); }
    // En celular el autoplay solo cambia el fondo; la vista previa se abre al tocar un servicio.
    if (mobile.matches && auto) { if (preview.parentElement !== inner) inner.append(preview); return; }
    preview.innerHTML = panel(s);
    const tryBtn = preview.querySelector(".try");
    if (tryBtn) tryBtn.onclick = () => {
      const slot = preview.querySelector(".demo-slot");
      slot.innerHTML = `<div data-demo="${s.demo}"${s.sw ? " data-switch" : ""}></div>`;
      FWPreview.mountAll(slot); tryBtn.remove(); stopAuto();
    };
    if (mobile.matches) {
      links[i].parentElement.append(preview);
      if (focusPanel) setTimeout(() => links[i].scrollIntoView({ behavior: still.matches ? "auto" : "smooth", block: "start" }), 60);
    } else if (preview.parentElement !== inner) inner.append(preview);
  }

  function next() { show((cur + 1) % SERVICES.length, { auto: true }); }
  function startAuto() { if (still.matches) return; clearInterval(timer); timer = setInterval(() => { if (!paused && !document.hidden) next(); }, DUR); }
  function stopAuto() { paused = true; links.forEach(a => a.classList.remove("auto")); clearTimeout(resume); }
  function pauseFor(ms) { stopAuto(); resume = setTimeout(() => { paused = false; startAuto(); }, ms); }

  links.forEach((a, i) => {
    a.style.setProperty("--dur", DUR + "ms");
    a.addEventListener("mouseenter", () => { if (hover.matches && !mobile.matches) { show(i); pauseFor(20000); } });
    a.addEventListener("focus", () => { if (!mobile.matches) { show(i); pauseFor(20000); } });
    a.addEventListener("click", e => {
      // Pantallas táctiles: el primer toque abre la vista previa del servicio y el segundo entra.
      const touch = mobile.matches || !hover.matches;
      if (!touch) return;
      const open = mobile.matches ? openUnder(i) : cur === i;
      if (open) return;
      e.preventDefault(); stopAuto(); show(i, { force: true, focusPanel: true });
    });
  });
  document.addEventListener("keydown", e => {
    if (!["ArrowDown", "ArrowUp"].includes(e.key) || e.target.closest("input,textarea,select")) return;
    e.preventDefault();
    const i = (Math.max(cur, 0) + (e.key === "ArrowDown" ? 1 : SERVICES.length - 1)) % SERVICES.length;
    links[i].focus();
  });
  mobile.addEventListener("change", () => { inner.append(preview); show(Math.max(cur, 0), { force: true, auto: mobile.matches }); });

  // Si llega con #servicio (ej. index.html#sim), se abre ese servicio.
  const start = Math.max(0, SERVICES.findIndex(s => "#" + s.k === location.hash));
  if (location.hash) { show(start, { force: true }); stopAuto(); }
  else { show(0, { auto: true }); startAuto(); }
})();
</script>
</body>
</html>
